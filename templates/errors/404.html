{% extends "base.html" %}

{% block title %}Page Not Found - Antigravity Expense Tracker{% endblock %}

{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 70vh;">
    <div class="glass-card shadow-lg animate-entrance delay-2 p-5 w-100" style="max-width: 550px;">
        <span class="display-1 fw-bold brand-font d-block" style="background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</span>
        <h2 class="h3 brand-font my-3">Lost in Gravitational Space</h2>
        <p class="text-secondary mb-4">The page you are looking for has floated away or doesn't exist. Let's get you back to solid ground.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn-premium py-3 px-4">
            <i class="bi bi-house me-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
